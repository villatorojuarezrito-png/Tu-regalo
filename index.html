<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif;box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#ffd6e7,#ff8fab);display:flex;align-items:center;justify-content:center;padding:20px}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;width:100%}
.hidden{display:none !important}
.card{background:white;padding:28px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15);text-align:center;max-width:380px;width:100%}
h1{color:#ff5a8a;margin:0 0 10px}
input{width:90%;padding:14px;border-radius:12px;border:2px solid #ffc2d1;text-align:center;font-size:20px;margin:15px 0}
.btn{background:#ff5a8a;color:white;border:none;padding:14px 22px;border-radius:12px;font-size:16px;width:100%;cursor:pointer}
.btn:active{transform:scale(.95)}
.error{color:#ff3b3b;font-size:14px;min-height:18px}
.ramo{font-size:60px;animation:pop 1s infinite}
.tulipanes{font-size:30px}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
</style>
</head>
<body>

<div id="pantalla1" class="screen">
  <div class="card">
    <h1>Hola muchacha :)</h1>
    <p>Este regalo tiene contraseña.<br>Solo se abre si sacaste 7 o más</p>
    <input type="number" id="calif" placeholder="Tu calificación">
    <br>
    <button class="btn" onclick="desbloquear()">Desbloquear 🌷</button>
    <div id="err" class="error"></div>
  </div>
</div>

<div id="pantalla2" class="screen hidden">
  <div class="card">
    <div class="ramo">💐</div>
    <div class="tulipanes">
      <span class="tulip">🌷</span><span class="tulip">🌷</span><span class="tulip">🌷</span>
    </div>
    <h1>¡SABÍA QUE PODÍAS!</h1>
    <p>Te dije que podías. Estoy muy orgulloso de ti ❤️</p>
    <p>Este regalito es para ti con mucho cariño</p>
  </div>
</div>

<script>
function desbloquear(){
  var input = document.getElementById('calif');
  var valor = parseFloat(input.value);
  var err = document.getElementById('err');
  if(isNaN(valor)){
    err.textContent = 'Escribe tu calificación';
    return;
  }
  if(valor >= 7){
    document.getElementById('pantalla1').classList.add('hidden');
    document.getElementById('pantalla2').classList.remove('hidden');
  } else {
    err.textContent = 'Tienes que sacar 7 o más 😢 ¡Tú puedes!';
  }
}
</script>
</body>
</html>
